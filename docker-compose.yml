version: '3.8'

services:
  # Servicio de Base de Datos (MySQL)
  database:
    image: mysql:8.0
    container_name: festival_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: devops_pass
      MYSQL_DATABASE: festival_db
    ports:
      - "3307:3306"  # <--- CAMBIA AQUÍ: 3307 en tu PC y 3306 en el contenedor
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - festival_network

  # Servicio del Backend (API Flask)
  backend:
    build: ./backend
    container_name: festival_backend_container
    restart: always
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: devops_pass
      DB_NAME: festival_db
    ports:
      - "5000:5000"
    depends_on:
      - database
    networks:
      - festival_network

  # Servicio del Frontend (Nginx)
  frontend:
    build: ./frontend
    container_name: festival_frontend_container
    restart: always
    ports:
      - "8080:80"
    networks:
      - festival_network

volumes:
  db_data:
    driver: local

networks:
  festival_network:
    driver: bridge